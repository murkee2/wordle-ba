<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121213" />
    <title>WORDLE BA</title>
  </head>
  <body class="bg-zinc-950 bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:24px_24px] text-zinc-100 min-h-screen flex flex-col justify-between">
    <div id="app" class="mx-auto flex min-h-screen w-full max-w-2xl flex-col px-4 sm:px-6">
      <header class="game-header">
        <a href="#" target="_blank" class="portal-badge px-2.5 py-1 text-xs font-semibold rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 transition">BosnaDLE <span class="text-emerald-400 text-[10px]">↗</span></a>
        <h1><span>Wordle</span><b>BA</b></h1>
        <div class="header-actions">
          <button id="mode-button" class="mode-badge" type="button" aria-label="Prebaci na slobodnu igru">Dnevno</button>
          <button id="help-button" class="header-icon" type="button" aria-label="Pomoć">?</button>
          <button id="stats-button" class="header-icon" type="button" aria-label="Statistika">▥</button>
        </div>
      </header>
      <main class="game-main">
        <section id="board" aria-label="Tabla za pogađanje"></section>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <section id="keyboard" aria-label="Virtuelna tastatura">
          <div class="keyboard-row" data-row="1"></div>
          <div class="keyboard-row" data-row="2"></div>
          <div class="keyboard-row" data-row="3"></div>
        </section>
      </main>
    </div>
    <div id="game-modal" class="modal-backdrop" hidden>
      <section class="game-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="close-modal" class="modal-close" type="button" aria-label="Zatvori">×</button>
        <p class="modal-kicker">WORDLE BA</p>
        <h2 id="modal-title"></h2>
        <p id="modal-subtitle"></p>
        <div class="stats-grid">
          <div><strong id="stat-played">0</strong><span>Odigrano</span></div>
          <div><strong id="stat-win-rate">0%</strong><span>Pobjede %</span></div>
          <div><strong id="stat-streak">0</strong><span>Trenutni niz</span></div>
          <div><strong id="stat-best">0</strong><span>Najbolji niz</span></div>
        </div>
        <div class="countdown-wrap"><span>Sljedeća riječ za</span><strong id="countdown">00:00:00</strong></div>
        <button id="share-button" class="share-button" type="button">PODIJELI REZULTAT</button>
        <button id="new-game-button" class="share-button secondary-button" type="button" hidden>IGRAJ PONOVO</button>
      </section>
    </div>
    <div id="help-modal" class="modal-backdrop" hidden>
      <section class="game-modal help-modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
        <button class="modal-close" type="button" data-close-modal="help-modal" aria-label="Zatvori">×</button>
        <p class="modal-kicker">WORDLE BA</p>
        <h2 id="help-title">Kako igrati</h2>
        <p>Pogodi riječ od 5 slova u najviše 6 pokušaja.</p>
        <div class="help-examples">
          <div><strong class="example-tile tile-correct">Z</strong><span>Zeleno: slovo je na tačnom mjestu.</span></div>
          <div><strong class="example-tile tile-present">U</strong><span>Žuto: slovo postoji, ali je na drugom mjestu.</span></div>
          <div><strong class="example-tile tile-absent">B</strong><span>Sivo: slovo se ne nalazi u riječi.</span></div>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
